name: Capturas de tela (conferir a aparencia)

# Roda quando pedido (aba Actions > Run workflow) e em ramos de trabalho (nunca no main). Compila o programa, abre no Windows
# do GitHub e guarda capturas de tela.
on:
  workflow_dispatch:
  push:
    branches-ignore: [ main, master ]

jobs:
  capturas:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publicar EXE
        run: >
          dotnet publish src/PtzStudio.App/PtzStudio.App.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish
      - name: Abrir o programa e capturar a tela
        shell: powershell
        run: ./tools/captura-tela.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Capturas-de-tela
          path: capturas/**
