name: Compilar PTZ Studio (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar
        run: dotnet restore PtzStudio.sln

      - name: Testes automatizados da lógica
        run: dotnet test tests/PtzStudio.Core.Tests/PtzStudio.Core.Tests.csproj -c Release --logger "trx;LogFileName=testes.trx" --results-directory TestResults

      - name: Pacotes com vulnerabilidade conhecida (informativo)
        continue-on-error: true
        run: dotnet list PtzStudio.sln package --vulnerable --include-transitive

      - name: Publicar EXE (sem exigir .NET instalado)
        run: >
          dotnet publish src/PtzStudio.App/PtzStudio.App.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Garantir o componente de video (libvlc) ao lado do EXE
        shell: pwsh
        run: |
          # A publicacao em arquivo unico embute as DLLs nativas dentro do EXE; o LibVLC precisa delas (e da pasta plugins) soltas em libvlc/win-x64.
          $dest = 'publish/libvlc/win-x64'
          if (-not (Test-Path "$dest/libvlc.dll")) {
            $pkg = Join-Path $env:USERPROFILE '.nuget/packages/videolan.libvlc.windows'
            $dll = Get-ChildItem $pkg -Recurse -Filter libvlc.dll | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
            if (-not $dll) { throw "libvlc.dll nao encontrado no pacote VideoLAN.LibVLC.Windows" }
            New-Item -ItemType Directory -Force $dest | Out-Null
            Copy-Item (Join-Path $dll.DirectoryName '*') $dest -Recurse -Force
          }
          if (-not (Test-Path "$dest/libvlc.dll") -or -not (Test-Path "$dest/plugins")) { throw "libvlc.dll ou a pasta plugins nao esta em $dest" }
          $mb = (Get-ChildItem 'publish/libvlc' -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("Pasta libvlc incluida na publicacao: {0:N0} MB" -f $mb)

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Gerar instalador
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\PtzStudio.iss'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Resultado-dos-testes
          path: TestResults/**

      - uses: actions/upload-artifact@v4
        with:
          name: PTZStudio-Windows
          path: |
            publish/PTZStudio.exe
            publish/libvlc/**
            installer/Output/PTZStudio-Setup.exe
